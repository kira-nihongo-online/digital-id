<script>

const GAS_URL = "https://script.google.com/macros/s/AKfycbx0plBzgefYllqu8X_eP0mYzr2L3Cs_uJYt0fiEPgeP3pQffuZUQEQP4A6jNZ9lhM7Q/exec";

const params = new URLSearchParams(window.location.search);
const token = params.get("t");

if (token) {

  const script = document.createElement("script");

  script.src =
    GAS_URL +
    "?t=" + encodeURIComponent(token) +
    "&callback=gasCallback";

  window.gasCallback = function(data) {
    console.log("GASから取得したデータ:", data);

    const nameElement = document.createElement("div");

    const nameParts = data.name.split(" ");

    const line1 = nameParts[0] || "";
    const line2 = nameParts.slice(1).join(" ") || "";

    nameElement.innerHTML = line1 + "<br>" + line2;

    nameElement.style.position = "absolute";
    nameElement.style.top = "47%";
    nameElement.style.left = "50%";
    nameElement.style.transform = "translateX(-50%)";
    nameElement.style.color = "white";
    nameElement.style.fontSize = "28px";
    nameElement.style.fontWeight = "bold";
    nameElement.style.textAlign = "center";
    nameElement.style.lineHeight = "1.25";
    nameElement.style.whiteSpace = "nowrap";
    nameElement.style.zIndex = "10";

    document.body.appendChild(nameElement);
  };

  document.body.appendChild(script);

}

</script>
