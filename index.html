<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html,body{
  margin:0;
  padding:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
  font-family:sans-serif;
}

/* カード */
.card{
  position:relative;
  width:100vw;
  height:100vh;
}

/* 背景 */
.bg{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* 写真 */
.photo{
  position:absolute;
  top:32vh;
  left:50%;
  transform:translateX(-50%);
  width:148px;
  height:220px;

  border-radius:0px;   /* ←ここ変更（0でもOK） */
  object-fit:contain;   /* そのまま */
}

/* 名前共通 */
.name-jp,
.name-th{
  position:absolute;
  width:100%;
  text-align:center;
  color:white;
  text-shadow:0 3px 8px rgba(0,0,0,0.7);
}

/* 日本語 */
.name-jp{
  top:52vh;
  font-size:60px;
  font-weight:bold;
}

/* タイ語 */
.name-th{
  top:57vh;
  font-size:60px;
}


/* ======================
ボタンエリア
====================== */

.buttons{
  position:absolute;
  top:65vh;
  left:0;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}

/* ボタン */

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  width:260px;
  height:48px;
  box-sizing:border-box;
  padding:0 12px;
  background:white;
  color:#333;
  font-size:19px;
  font-weight:bold;
  line-height:1.2;
  border-radius:24px;
  text-align:center;
  text-decoration:none;
  box-shadow:0 4px 10px rgba(0,0,0,0.35);
  cursor:pointer;
}

</style>
</head>
