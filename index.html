<!DOCTYPE html>

<style>

html,body{

}

.card{
  position:relative;
  width:100%;
  height:100%;

}

.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.photo{
  position:absolute;
  top:24%;

.name-jp,

.name-th{

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}

.btn{

  align-items:center;
  justify-content:center;

  height:46px;

  background:white;
  color:#333;

  font-size:19px;
  font-weight:bold;

  border-radius:24px;

  text-align:center;
  text-decoration:none;

  cursor:pointer;
